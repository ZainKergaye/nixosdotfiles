name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test lock-file summary
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # -------------------------------------------------
      # 3️⃣ Install Nix + magic‑nix‑cache
      # -------------------------------------------------
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = 1

      - name: Setup Cachix 
        uses: cachix/cachix-action@v17
        with:
          name: zain-system-cache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # -------------------------------------------------
      # Build & test the new configuration
      # -------------------------------------------------
      - name: Build test configurations
        run: |
          echo "🔧  Building test hosts…"
          for host in thinkpad asus; do
            nix build .#nixosConfigurations.$host.config.system.build.toplevel \
              --show-trace --no-link --no-update-lock-file || {
                echo "❌  Build failed for $host"
                exit 1
              }
          done
          echo "✅  All builds succeeded"
